<script>
// Demo popup functions with scroll lock
function showDemoPopup(event) {
  // Prevent anchor jump
  if (event) {
    event.preventDefault();
  }

  const popup = document.getElementById('demo-popup');
  const overlay = document.getElementById('demo-popup-overlay');
  if (!popup || !overlay) return;

  // Store the trigger time in localStorage
  localStorage.setItem('demoPopupLastShown', Date.now().toString());

  // Show overlay
  overlay.style.display = 'block';
  overlay.offsetHeight; // Force reflow
  overlay.classList.add('show');

  // Show popup
  popup.style.display = 'block';
  popup.offsetHeight; // Force reflow
  popup.classList.add('show');

  // Lock body scroll
  document.body.style.overflow = 'hidden';

  // Add event listeners
  document.addEventListener('keydown', handleDemoEscapeKey);
  overlay.addEventListener('click', closeDemoPopup);
}

function closeDemoPopup() {
  const popup = document.getElementById('demo-popup');
  const overlay = document.getElementById('demo-popup-overlay');
  if (!popup || !overlay) return;

  overlay.classList.remove('show');
  popup.classList.remove('show');

  // Restore body scroll
  document.body.style.overflow = '';

  // Remove event listeners
  document.removeEventListener('keydown', handleDemoEscapeKey);
  overlay.removeEventListener('click', closeDemoPopup);

  setTimeout(() => {
    overlay.style.display = 'none';
    popup.style.display = 'none';
  }, 400);
}

function handleDemoEscapeKey(event) {
  if (event.key === 'Escape') {
    closeDemoPopup();
  }
}

// Automatic popup trigger at 50% scroll for giga-catalyst posts
(function() {
  const postPromotionType = '{{ post_promotion_type }}';
  const autoShowPopup = '{{ auto_show_post_promotion_popup }}' === 'true';

  if (postPromotionType === 'giga-catalyst' && autoShowPopup) {
    let hasTriggered = false;

    function checkScrollAndTrigger() {
      if (hasTriggered) return;

      // Calculate scroll percentage
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrollPercent = (scrollTop / scrollHeight) * 100;

      // Check if scrolled past 50%
      if (scrollPercent >= 50) {
        // Check if popup was shown in the last hour
        const lastShown = localStorage.getItem('demoPopupLastShown');
        const now = Date.now();
        const oneHour = 60 * 60 * 1000; // 1 hour in milliseconds

        if (!lastShown || (now - parseInt(lastShown)) > oneHour) {
          hasTriggered = true;
          showDemoPopup();
          // Remove scroll listener after triggering
          window.removeEventListener('scroll', checkScrollAndTrigger);
        }
      }
    }

    // Add scroll listener
    window.addEventListener('scroll', checkScrollAndTrigger);
  }
})();

</script>
